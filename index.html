    <div class="card">
        <h1 class="title">My Bear-Hunnter-Ninja game</h1>
        <div class="menu">
            <p class="choice" id="user"></p>
            <p class="choice" id="pc"></p>
        </div>
    </div>
    <script type="text/javascript"> //MIME tpye
        
        // Greet user by input name
        const YourName = prompt('Welcome to Bear Hunter Ninja! Please Enter your name to get started: ');
        let msgGreet = `Hi ${YourName}! Let\'s Play!!`; //assignment requires this, likley isn't neccessary with template literal.
        alert(msgGreet);
        

        
        // Generates User and CPU choice
        let yourChoice = prompt('Who are you: Bear, Ninja, or Hunter?');
        const computerChoice = 'bear'; //This is what you meant by hard coded correct? const bc hardcoded
        
        

        // Evaluates & compares choices
        /* Bear beat Ninja beat Hunter beat Bear */
        let gameWinner;
        if (yourChoice/*.lower*/ === computerChoice) {
            //tie
            gameWinner = null
        }
        else if (yourChoice === "bear" && computerChoice !== 'hunter') {
            gameWinner = true; 
        }
        else if (yourChoice === 'ninja' && computerChoice !== 'bear') {
            gameWinner = true;
        }
        else if (yourChoice === 'hunter' && computerChoice !== 'ninja') {
            gameWinner = true;
        }
        else gameWinner = false;
        

        let result;
        switch (gameWinner) {
            case null:
                result = 'You Tie!!'
                break;
                case true:
                result = 'You Win!!'
                break;
            case false:
                result = 'You Lose!!'
                break;
            default:
                console.error('Error occured, please check code•••')
                break;
        }


        //craft messages
        let nameAndChoice = YourName + ', you picked ' + yourChoice + '!';
        let pcAndChoice = `The computer picked ${computerChoice}!`;
        
        
        // Print messages to DOM
        document.getElementById('user').innerHTML = nameAndChoice;
        document.getElementById('pc').innerHTML= pcAndChoice;
        

        // Print/log messages to console
        {console.log(nameAndChoice,'\n',pcAndChoice);}

    </script>
