<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta name="author" content="Emmanuelle Allen">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Document</title>
</head>
<body>
    <div class="card">
        <h1 class="title">My Bear-Hunter-Ninja game</h1>
        <div class="menu">
            <p class="choice" id="user">User:</p>
            <p class="choice" id="pc">Computer:</p>
            <p class="choice" id="result">Result:</p>
        </div>
    </div>
    <script type="text/javascript"> //MIME type
        
        // Greet user by input name
        const YourName = prompt('Welcome to Bear Hunter Ninja! Please Enter your name to get started: ');
        let msgGreet = `Hi ${YourName}! Let\'s Play!!`;
        alert(msgGreet);
        

        
        // Generates User and CPU choice
        let yourChoice = prompt('Who are you: Bear, Ninja, or Hunter?')//.toLowerCase(); //no functions() yet
        const ComputerChoice = 'bear';
        
        

        // Evaluates & compares choices
        /* Bear beat Ninja beat Hunter beat Bear */
        let gameWinner; // user oriented variable
        if (yourChoice === ComputerChoice) { //tie
            gameWinner = null
        }
        else if (yourChoice === "bear" && ComputerChoice !== 'hunter') {
            gameWinner = true; 
        }
        else if (yourChoice === 'ninja' && ComputerChoice !== 'bear') {
            gameWinner = true;
        }
        else if (yourChoice === 'hunter' && ComputerChoice !== 'ninja') {
            gameWinner = true;
        }
        else gameWinner = false;
        

        let result;
        switch (gameWinner) {
            case null:
                result = 'You Tie!!'
                break;
                case true:
                result = 'You Win!!'
                break;
            case false:
                result = 'You Lose!!'
                break;
            default:
                console.error('Error occured, please check code•••')
                break;
        }


        //craft messages
        let nameAndChoice = YourName + ', you picked ' + yourChoice + '!';
        let pcAndChoice = `The computer picked ${ComputerChoice}!`;
        result = result //redundant code, for consistency, this is defined in switch statement
        
        
        // Print messages to DOM
        document.getElementById('user').innerHTML = nameAndChoice;
        document.getElementById('pc').innerHTML= pcAndChoice;
        document.getElementById('result').innerHTML = result;
        

        // Print/log messages to console
        console.log(
            nameAndChoice,
            '\n',
            pcAndChoice,
            '\n',
            result
            );
        

    </script>
</body>
</html>
